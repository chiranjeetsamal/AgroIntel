[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "agrointel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2", "pandas>=2.2,<4", "numpy>=1.26", "joblib>=1.4", "matplotlib>=3.8", "requests>=2.31", "pyyaml>=6"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
agrointel = "agrointel.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
